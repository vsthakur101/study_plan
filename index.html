<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Plan - Learning Resources</title>
    <meta name="description" content="Comprehensive learning roadmaps and study materials">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="menuToggle" aria-label="Toggle menu">
        ☰
    </button>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Study Plan</h1>
                <p>Learning Resources</p>
            </div>

            <!-- Progress Tracker Link -->
            <a href="tracker.html" class="tracker-link" style="display: block; margin: 1rem; padding: 0.75rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s ease;">
                📊 Progress Tracker & Calendar
            </a>

            <nav>
                <ul class="nav-list" id="navList">
                    <!-- Navigation items will be populated by JavaScript -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <div class="markdown-content" id="content">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Configure marked.js
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        // State
        let manifestData = null;
        let currentFile = null;

        // DOM Elements
        const navList = document.getElementById('navList');
        const content = document.getElementById('content');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');

        // Mobile menu toggle
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        // Initialize the app
        async function init() {
            try {
                // Fetch manifest
                const response = await fetch('manifest.json');
                if (!response.ok) {
                    throw new Error('Failed to load manifest.json');
                }
                manifestData = await response.json();

                // Populate navigation
                populateNavigation();

                // Load first file by default
                if (manifestData.files && manifestData.files.length > 0) {
                    loadMarkdownFile(manifestData.files[0].path);
                } else {
                    content.innerHTML = '<p>No markdown files found. Run <code>python build.py</code> to generate the manifest.</p>';
                }
            } catch (error) {
                console.error('Error initializing app:', error);
                content.innerHTML = `
                    <div style="color: #dc2626; padding: 20px;">
                        <h2>Error Loading Content</h2>
                        <p>${error.message}</p>
                        <p>Make sure to run <code>python build.py</code> to generate the manifest.json file.</p>
                    </div>
                `;
            }
        }

        // Populate navigation menu
        function populateNavigation() {
            navList.innerHTML = '';

            manifestData.files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'nav-item';

                const link = document.createElement('a');
                link.className = 'nav-link';
                link.textContent = file.title;
                link.href = '#';
                link.dataset.path = file.path;

                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadMarkdownFile(file.path);

                    // Close mobile menu
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('open');
                    }
                });

                li.appendChild(link);
                navList.appendChild(li);
            });
        }

        // Load and render markdown file
        async function loadMarkdownFile(path) {
            try {
                content.innerHTML = '<div class="loading">Loading...</div>';

                // Fetch markdown file
                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error(`Failed to load ${path}`);
                }
                const markdownText = await response.text();

                // Convert markdown to HTML
                const htmlContent = marked.parse(markdownText);
                content.innerHTML = htmlContent;

                // Apply syntax highlighting to code blocks
                content.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                // Update active nav item
                updateActiveNavItem(path);

                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });

                currentFile = path;
            } catch (error) {
                console.error('Error loading markdown:', error);
                content.innerHTML = `
                    <div style="color: #dc2626;">
                        <h2>Error Loading File</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Update active navigation item
        function updateActiveNavItem(path) {
            const navLinks = navList.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                if (link.dataset.path === path) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Handle browser back/forward
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.file) {
                loadMarkdownFile(e.state.file);
            }
        });

        // Start the app
        init();
    </script>
</body>
</html>
