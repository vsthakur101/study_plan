<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .progress-ring {
            transform: rotate(-90deg);
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }
        .roadmap-card {
            transition: all 0.3s ease;
        }
        .roadmap-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .checkbox-custom {
            transition: all 0.2s ease;
        }
        .checkbox-custom:checked {
            animation: checkPulse 0.3s ease;
        }
        @keyframes checkPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .streak-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .phase-header {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .phase-header:hover {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        .task-item {
            transition: all 0.2s ease;
        }
        .task-item:hover {
            background: #f9fafb;
        }
        .task-item.completed {
            background: #f0fdf4;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center">
                        <i class="fas fa-graduation-cap text-2xl text-indigo-600 mr-3"></i>
                        <h1 class="text-xl font-bold text-gray-900">Learning Roadmap Tracker</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="statsBtn" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
                            <i class="fas fa-chart-line text-gray-600"></i>
                        </button>
                        <button id="exportBtn" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
                            <i class="fas fa-download text-gray-600"></i>
                        </button>
                        <button id="resetBtn" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
                            <i class="fas fa-redo text-gray-600"></i>
                        </button>
                        <div id="streakContainer" class="flex items-center px-3 py-1 rounded-full streak-badge text-white text-sm">
                            <i class="fas fa-fire mr-2"></i>
                            <span id="streakCount">0</span> day streak
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Roadmap Selection -->
            <section id="roadmapSelection" class="mb-8 fade-in">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Choose Your Learning Path</h2>
                <div id="roadmapGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Roadmap cards will be inserted here -->
                </div>
            </section>

            <!-- Current Roadmap Progress -->
            <section id="currentRoadmap" class="hidden fade-in">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 id="currentRoadmapTitle" class="text-2xl font-bold text-gray-900"></h2>
                            <p id="currentRoadmapDescription" class="text-gray-600 mt-1"></p>
                        </div>
                        <button id="changeRoadmapBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                            <i class="fas fa-exchange-alt mr-2"></i>Change Roadmap
                        </button>
                    </div>

                    <!-- Progress Overview -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div class="stat-card text-white rounded-lg p-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/80 text-sm">Overall Progress</p>
                                    <p id="overallProgress" class="text-2xl font-bold">0%</p>
                                </div>
                                <svg width="60" height="60" class="progress-ring">
                                    <circle cx="30" cy="30" r="25" stroke="#ffffff30" stroke-width="5" fill="none"/>
                                    <circle id="progressCircle" cx="30" cy="30" r="25" stroke="#ffffff" stroke-width="5" fill="none"
                                            stroke-dasharray="157" stroke-dashoffset="157" class="progress-ring-circle"/>
                                </svg>
                            </div>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-lg p-4">
                            <p class="text-gray-600 text-sm">Tasks Completed</p>
                            <p id="tasksCompleted" class="text-2xl font-bold text-gray-900">0</p>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-lg p-4">
                            <p class="text-gray-600 text-sm">Total Tasks</p>
                            <p id="totalTasks" class="text-2xl font-bold text-gray-900">0</p>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-lg p-4">
                            <p class="text-gray-600 text-sm">Current Phase</p>
                            <p id="currentPhase" class="text-lg font-bold text-gray-900">-</p>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="flex flex-wrap gap-3 mb-6">
                        <button id="markAllTodayBtn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                            <i class="fas fa-check-double mr-2"></i>Mark All Today Complete
                        </button>
                        <button id="unmarkAllTodayBtn" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                            <i class="fas fa-times mr-2"></i>Unmark All Today
                        </button>
                    </div>

                    <!-- Daily Progress -->
                    <div class="mb-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-calendar-check mr-2 text-indigo-600"></i>
                            Today's Progress
                        </h3>
                        <div id="todayProgress" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Today's tasks will be inserted here -->
                        </div>
                    </div>

                    <!-- Phase Progress -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-tasks mr-2 text-indigo-600"></i>
                            All Phases
                        </h3>
                        <div id="phasesContainer" class="space-y-4">
                            <!-- Phases will be inserted here -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Statistics Modal -->
            <div id="statsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white rounded-lg max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="p-6 border-b border-gray-200">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xl font-bold text-gray-900">
                                <i class="fas fa-chart-line mr-2 text-indigo-600"></i>
                                Your Statistics
                            </h3>
                            <button id="closeStatsBtn" class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="statsContent">
                            <!-- Statistics will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="tracker.js"></script>
</body>
</html>
